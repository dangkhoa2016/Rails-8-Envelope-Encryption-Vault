default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  url: <%= ENV["DATABASE_URL"] || "postgresql://postgres:postgres@127.0.0.1:5432/ruby_envelope_vault_development" %>

test:
  <<: *default
  url: <%= ENV["TEST_DATABASE_URL"] || "postgresql://postgres:postgres@127.0.0.1:5432/ruby_envelope_vault_test" %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
