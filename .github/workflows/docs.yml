name: Documentation
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  bilingual-documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Verify the pinned application commit and its Git tree
      - name: Check English/Vietnamese parity and local links
        run: python3 script/doc-quality-check
      - name: Validate the single reproducible Kaggle / Colab notebook
        run: python3 script/notebook-demo-check
      - name: Check published documentation links
        run: bash script/doc-link-check
